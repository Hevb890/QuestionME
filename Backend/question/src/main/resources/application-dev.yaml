spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://question-db:5432/question_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgrespassword}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://authorization-service:8081/.well-known/jwks.json

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        formal_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  data:
    redis:
      host: localhost
      port: 6379

logging:
  level:
    root: INFO
    om.platform.auth: DEBUG
    org.springframework.security: DEBUG
    org.springframework.security.oauth2: TRACE
