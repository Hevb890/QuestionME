spring:
  config:
    activate:
      on-profile: dev

  cloud:
    gateway:
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configuration:
          "[/**]":
          allowedOrigins:
            - "http://localhost:3000"
            - "http://localhost:8080"
          allowedMethods:
            - GET
            - POST
            - PUT
            - PATCH
            - DELETE
            - OPTIONS
          allowedHeaders: "*"
          allowedCredentials: true
      routes:
        - id: authorization-service-dev
          uri: http://authorization-service:8081
          predicates:
            - Path=/api/v1/auth/**, /.well-known/jwks.json

        - id: question-service-dev
          uri: http://question-service:8082
          predicates:
            - Path=/api/v1/questions/**

logging:
  level:
    root: INFO
    org.springframework.cloud.gateway: DEBUG
    org.springframework.http.server.reactive: DEBUG
